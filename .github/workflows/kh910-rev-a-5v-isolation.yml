name: KH910 Rev A 5V Isolation

on:
  workflow_dispatch:
  push:
    branches:
      - ayab-esp32-kh910-rev-a
    paths:
      - 'ayab-esp32/tools/patch_rev_a_5v_isolation.py'
      - '.github/workflows/kh910-rev-a-5v-isolation.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ayab-esp32-kh910-rev-a
          fetch-depth: 0

      - name: Patch LM66100 reverse-current isolation
        run: python3 ayab-esp32/tools/patch_rev_a_5v_isolation.py

      - name: Confirm isolation topology and metadata
        run: |
          grep -n 'LM66100DCKR' ayab-esp32/psu.kicad_sch
          grep -n 'C2869734' ayab-esp32/psu.kicad_sch
          grep -n 'MACHINE_5V_RAW' ayab-esp32/psu.kicad_sch
          if grep -q 'property "Reference" "R406"' ayab-esp32/psu.kicad_sch; then
            echo 'R406 conductive link still present'
            exit 1
          fi

      - name: Generate MCU pin audit
        run: python3 ayab-esp32/tools/audit_esp32_pinmap.py

      - name: Install KiCad
        run: bash ./scripts/dependencies.sh

      - name: Run ERC and DRC before commit
        run: |
          kicad-cli jobset run --file ./ayab-library/ayab-jobset.kicad_jobset --output 546878ce-2bd2-4fb6-b2a1-e67785afa624 ayab-esp32/ayab-esp32.kicad_pro

      - name: Commit validated 5V isolation
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- ayab-esp32/psu.kicad_sch ayab-esp32/KH910_REV_A_CURRENT_PIN_AUDIT.md)" ]; then
            echo "5V isolation already in target state"
            exit 0
          fi
          git config user.name "Newton Sewing Studio AYAB Bot"
          git config user.email "newtonsewingstudio@gmail.com"
          git add ayab-esp32/psu.kicad_sch ayab-esp32/KH910_REV_A_CURRENT_PIN_AUDIT.md
          git commit -m "Add LM66100 machine 5V reverse-current isolation"
          git pull --rebase origin ayab-esp32-kh910-rev-a
          git push

      - name: Archive ERC/DRC artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kh910-rev-a-5v-isolation-erc-drc
          path: DesignChecks
