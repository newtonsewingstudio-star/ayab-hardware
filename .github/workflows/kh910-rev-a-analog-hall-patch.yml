name: KH910 Rev A Analog Hall Patch

on:
  workflow_dispatch:
  push:
    branches:
      - ayab-esp32-kh910-rev-a
    paths:
      - 'ayab-esp32/tools/patch_rev_a_analog_hall.py'
      - 'ayab-esp32/tools/patch_rev_a_analog_hall_v2.py'
      - 'ayab-esp32/tools/patch_rev_a_analog_hall_v3.py'
      - '.github/workflows/kh910-rev-a-analog-hall-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ayab-esp32-kh910-rev-a
          fetch-depth: 0

      - name: Patch passive analog Hall paths
        run: python3 ayab-esp32/tools/patch_rev_a_analog_hall_v3.py

      - name: Generate corrected MCU pin audit
        run: python3 ayab-esp32/tools/audit_esp32_pinmap.py

      - name: Show pin audit
        run: cat ayab-esp32/KH910_REV_A_CURRENT_PIN_AUDIT.md

      - name: Install KiCad
        run: bash ./scripts/dependencies.sh

      - name: Run ERC and DRC before commit
        run: |
          kicad-cli jobset run --file ./ayab-library/ayab-jobset.kicad_jobset --output 546878ce-2bd2-4fb6-b2a1-e67785afa624 ayab-esp32/ayab-esp32.kicad_pro

      - name: Commit validated analog Hall schematic change
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- ayab-esp32/ayab-esp32.kicad_sch ayab-esp32/mcu.kicad_sch ayab-esp32/ioconditioning.kicad_sch ayab-esp32/KH910_REV_A_CURRENT_PIN_AUDIT.md)" ]; then
            echo "Analog Hall schematic already in target state"
            exit 0
          fi
          git config user.name "Newton Sewing Studio AYAB Bot"
          git config user.email "newtonsewingstudio@gmail.com"
          git add ayab-esp32/ayab-esp32.kicad_sch \
                  ayab-esp32/mcu.kicad_sch \
                  ayab-esp32/ioconditioning.kicad_sch \
                  ayab-esp32/KH910_REV_A_CURRENT_PIN_AUDIT.md
          git commit -m "Add passive analog Hall ADC paths"
          git pull --rebase origin ayab-esp32-kh910-rev-a
          git push

      - name: Archive ERC/DRC artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kh910-rev-a-analog-hall-erc-drc
          path: DesignChecks
