name: KH910 Rev A Solenoid Gate Stage

on:
  workflow_dispatch:
  push:
    branches:
      - ayab-esp32-kh910-rev-a
    paths:
      - 'ayab-esp32/solenoids.kicad_sch'
      - 'ayab-esp32/tools/stage_rev_a_solenoid_gate_local_v1.py'
      - 'ayab-esp32/tools/fix_rev_a_solenoid_pg_corner.py'
      - 'ayab-esp32/tools/route_rev_a_solenoid_enable_astar.py'
      - 'ayab-esp32/tools/stage_rev_a_solenoid_tp703_astar.py'
      - 'ayab-esp32/tools/validate_rev_a_solenoid_failsafe_pcb.py'
      - '.github/workflows/kh910-rev-a-solenoid-gate-stage.yml'

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ayab-esp32-kh910-rev-a
      - name: Install KiCad 9 runtime
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo apt-get install -qy --no-install-recommends kicad
      - name: Require clean promoted partition baseline
        run: |
          kicad-cli pcb drc --exit-code-violations -o /tmp/gate-baseline.rpt ayab-esp32/ayab-esp32.kicad_pcb
          cat /tmp/gate-baseline.rpt
      - name: Create staged board
        run: |
          rm -rf /tmp/solenoid-gate-stage
          mkdir -p /tmp/solenoid-gate-stage
          cp -a ayab-esp32/. /tmp/solenoid-gate-stage/
      - name: Stage compact local gate
        run: |
          set -o pipefail
          /usr/bin/python3 ayab-esp32/tools/stage_rev_a_solenoid_gate_local_v1.py /tmp/solenoid-gate-stage/ayab-esp32.kicad_pcb | tee /tmp/gate-stage.txt
      - name: Clear P-gate corner conflict
        run: |
          /usr/bin/python3 ayab-esp32/tools/fix_rev_a_solenoid_pg_corner.py /tmp/solenoid-gate-stage/ayab-esp32.kicad_pcb | tee -a /tmp/gate-stage.txt
      - name: Route solenoid enable with all-layer via clearance
        run: |
          /usr/bin/python3 ayab-esp32/tools/route_rev_a_solenoid_enable_astar.py /tmp/solenoid-gate-stage/ayab-esp32.kicad_pcb | tee -a /tmp/gate-stage.txt
      - name: Stage switched-rail test point
        run: |
          /usr/bin/python3 ayab-esp32/tools/stage_rev_a_solenoid_tp703_astar.py /tmp/solenoid-gate-stage/ayab-esp32.kicad_pcb | tee -a /tmp/gate-stage.txt
      - name: Refill zones
        run: |
          /usr/bin/python3 ayab-esp32/tools/refill_rev_a_zones.py /tmp/solenoid-gate-stage/ayab-esp32.kicad_pcb
      - name: Require zero staged DRC violations and unconnected pads
        run: |
          set +e
          kicad-cli pcb drc --exit-code-violations -o /tmp/gate-stage-drc.rpt /tmp/solenoid-gate-stage/ayab-esp32.kicad_pcb
          rc=$?
          set -e
          cat /tmp/gate-stage-drc.rpt
          echo "DRC_REPORT_EXIT=$rc"
          exit $rc
      - name: Require solenoid fail-safe topology
        run: |
          /usr/bin/python3 ayab-esp32/tools/validate_rev_a_solenoid_failsafe_pcb.py /tmp/solenoid-gate-stage/ayab-esp32.kicad_pcb | tee /tmp/gate-topology.txt
      - name: Upload gate-stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kh910-solenoid-gate-stage
          path: |
            /tmp/gate-baseline.rpt
            /tmp/gate-stage.txt
            /tmp/gate-stage-drc.rpt
            /tmp/gate-topology.txt
            /tmp/solenoid-gate-stage/ayab-esp32.kicad_pcb
          if-no-files-found: ignore
