name: AYAB ESP32 Hardware Check

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - ayab-esp32-kh910-rev-a
    paths:
      - ayab-esp32/**
      - ayab-library/**
      - .github/workflows/ayab-esp32-design.yml
      - scripts/dependencies.sh

  pull_request:
    branches:
      - main
    paths:
      - ayab-esp32/**
      - ayab-library/**
      - .github/workflows/ayab-esp32-design.yml
      - scripts/dependencies.sh

env:
  workflow_project_dir: ayab-esp32
  kicad_project_name: ayab-esp32
  
jobs:
  buildfiles:
    name: Design check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install KiCad
        run: bash ./scripts/dependencies.sh

      - name: Require zero Rev A PCB errors, unconnected pads, footprint errors, and parity errors
        run: |
          kicad-cli pcb drc --exit-code-violations \
            --schematic-parity \
            -o /tmp/rev-a-hardware-check-drc.rpt \
            ayab-esp32/ayab-esp32.kicad_pcb
          # KiCad 9 prints the parity count to stdout and fails this command on
          # any parity issue; it does not repeat the parity count in the report.
          cat /tmp/rev-a-hardware-check-drc.rpt
          grep -Fxq '** Found 0 DRC violations **' /tmp/rev-a-hardware-check-drc.rpt
          grep -Fxq '** Found 0 unconnected pads **' /tmp/rev-a-hardware-check-drc.rpt
          grep -Fxq '** Found 0 Footprint errors **' /tmp/rev-a-hardware-check-drc.rpt

      - name: Require zero schematic ERC errors
        run: |
          set +e
          kicad-cli sch erc --exit-code-violations \
            -o /tmp/rev-a-hardware-check-erc.rpt \
            ayab-esp32/ayab-esp32.kicad_sch
          rc=$?
          set -e
          cat /tmp/rev-a-hardware-check-erc.rpt
          echo "ERC_EXIT=$rc"
          grep -Eq 'ERC messages:.*Errors 0([[:space:]]|$)' /tmp/rev-a-hardware-check-erc.rpt

      - name: Require all frozen Rev A audits and manufacturing metadata
        run: |
          python3 ayab-esp32/tools/validate_rev_a_machine_sense_protection.py \
            ayab-esp32/ayab-esp32.kicad_pcb
          python3 ayab-esp32/tools/validate_rev_a_solenoid_failsafe_pcb.py \
            ayab-esp32/ayab-esp32.kicad_pcb
          python3 ayab-esp32/tools/audit_rev_a_prototype_pcb_parity.py
          python3 ayab-esp32/tools/audit_rev_a_solenoid_gate_source.py
          python3 ayab-esp32/tools/audit_rev_a_power_pcb_parity.py \
            --output /tmp/rev-a-power-parity.md
          python3 ayab-esp32/tools/audit_rev_a_hall_pcb_parity.py
          python3 ayab-esp32/tools/audit_rev_a_kl_pcb_parity.py
          python3 ayab-esp32/tools/audit_esp32_pinmap.py
          grep -Fxq -- '- Target-function mismatches: **0**' \
            ayab-esp32/KH910_REV_A_CURRENT_PIN_AUDIT.md
          python3 ayab-esp32/tools/validate_rev_a_manufacturing_metadata.py

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erc-drc-artifacts
          path: |
            DesignChecks
            /tmp/rev-a-hardware-check-drc.rpt
            /tmp/rev-a-hardware-check-erc.rpt
            /tmp/rev-a-power-parity.md
