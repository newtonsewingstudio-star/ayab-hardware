name: KH910 Rev A Layout Debug SVG

on:
  workflow_dispatch:
  push:
    branches:
      - ayab-esp32-kh910-rev-a
    paths:
      - 'ayab-esp32/tools/audit_rev_a_kl_pcb_parity.py'
      - '.github/workflows/kh910-rev-a-layout-debug-svg.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ayab-esp32-kh910-rev-a
          fetch-depth: 0
      - name: Install KiCad
        run: bash ./scripts/dependencies.sh
      - name: Generate K-L PCB parity audit
        run: |
          /usr/bin/python3 ayab-esp32/tools/audit_rev_a_kl_pcb_parity.py
          test -s ayab-esp32/KH910_REV_A_KL_PCB_PARITY.md
          cat ayab-esp32/KH910_REV_A_KL_PCB_PARITY.md
      - name: Export combined copper and edge SVG
        run: |
          kicad-cli pcb export svg \
            --layers F.Cu,In1.Cu,In2.Cu,B.Cu,Edge.Cuts \
            --mode-single \
            --fit-page-to-board \
            --exclude-drawing-sheet \
            -o ayab-esp32/KH910_REV_A_LAYOUT_DEBUG.svg \
            ayab-esp32/ayab-esp32.kicad_pcb
          test -s ayab-esp32/KH910_REV_A_LAYOUT_DEBUG.svg
      - name: Commit debug evidence
        run: |
          git config user.name "Newton Sewing Studio AYAB Bot"
          git config user.email "newtonsewingstudio@gmail.com"
          git add ayab-esp32/KH910_REV_A_LAYOUT_DEBUG.svg ayab-esp32/KH910_REV_A_KL_PCB_PARITY.md
          if git diff --cached --quiet; then
            echo "No debug evidence changes"
            exit 0
          fi
          git commit -m "Record Rev A layout and K-L PCB audit [skip ci]"
          git pull --rebase origin ayab-esp32-kh910-rev-a
          git push origin HEAD:ayab-esp32-kh910-rev-a
