name: KH910 Rev A Power Placement Probe

on:
  workflow_dispatch:
  push:
    branches:
      - ayab-esp32-kh910-rev-a
    paths:
      - 'ayab-esp32/tools/probe_rev_a_power_placement.py'
      - '.github/workflows/kh910-rev-a-power-placement-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ayab-esp32-kh910-rev-a
      - name: Install KiCad 9 runtime
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo apt-get install -qy --no-install-recommends kicad
      - name: Create disposable placement candidate
        run: |
          set -euo pipefail
          python3 ayab-esp32/tools/probe_rev_a_power_placement.py \
            ayab-esp32/ayab-esp32.kicad_pcb /tmp/rev-a-power-placement.kicad_pcb \
            > /tmp/rev-a-power-placement.log 2>&1
          cat /tmp/rev-a-power-placement.log
      - name: Record placement DRC without treating expected unconnected pads as success
        run: |
          set +e
          kicad-cli pcb drc --exit-code-violations \
            -o /tmp/rev-a-power-placement-drc.rpt /tmp/rev-a-power-placement.kicad_pcb
          drc_status=$?
          set -e
          test -e /tmp/rev-a-power-placement-drc.rpt
          cat /tmp/rev-a-power-placement-drc.rpt
          echo "Placement-probe DRC exit status: $drc_status (unconnected pads are expected at this stage)"
      - name: Archive disposable placement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kh910-rev-a-power-placement-probe
          path: |
            /tmp/rev-a-power-placement.kicad_pcb
            /tmp/rev-a-power-placement.log
            /tmp/rev-a-power-placement-drc.rpt
