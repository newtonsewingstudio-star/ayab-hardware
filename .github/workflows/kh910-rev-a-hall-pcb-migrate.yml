name: KH910 Rev A Hall ADC PCB Migration

on:
  workflow_dispatch:
  push:
    branches:
      - ayab-esp32-kh910-rev-a
    paths:
      - 'ayab-esp32/tools/migrate_rev_a_hall_pcb_serialized_v4.py'
      - 'ayab-esp32/tools/migrate_rev_a_hall_pcb_serialized_v4c.py'
      - 'ayab-esp32/tools/migrate_rev_a_hall_pcb_serialized_compat.py'
      - 'ayab-esp32/tools/route_rev_a_hall_astar.py'
      - 'ayab-esp32/tools/cleanup_rev_a_hall_v4c.py'
      - 'ayab-esp32/tools/refill_rev_a_zones.py'
      - '.github/workflows/kh910-rev-a-hall-pcb-migrate.yml'

permissions:
  contents: write

jobs:
  migrate-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ayab-esp32-kh910-rev-a
          fetch-depth: 0

      - name: Install KiCad
        run: bash ./scripts/dependencies.sh

      - name: Prove baseline PCB DRC is clean
        run: |
          kicad-cli pcb drc --exit-code-violations \
            -o /tmp/kh910-baseline-drc.rpt \
            ayab-esp32/ayab-esp32.kicad_pcb
          cat /tmp/kh910-baseline-drc.rpt

      - name: Create staged KiCad project copy
        run: |
          rm -rf /tmp/kh910-stage
          mkdir -p /tmp/kh910-stage
          cp -a ayab-esp32/. /tmp/kh910-stage/
          test -s /tmp/kh910-stage/ayab-esp32.kicad_pro
          test -s /tmp/kh910-stage/ayab-esp32.kicad_pcb

      - name: Stage Hall electrical migration v4c
        run: |
          python3 ayab-esp32/tools/migrate_rev_a_hall_pcb_serialized_v4c.py \
            ayab-esp32/ayab-esp32.kicad_pcb \
            /tmp/kh910-stage/ayab-esp32.kicad_pcb \
            | tee /tmp/kh910-hall-migration.txt
          test -s /tmp/kh910-stage/ayab-esp32.kicad_pcb

      - name: Route Hall ADC nets against staged board geometry
        run: |
          /usr/bin/python3 ayab-esp32/tools/route_rev_a_hall_astar.py \
            /tmp/kh910-stage/ayab-esp32.kicad_pcb
          cat /tmp/kh910-stage/KH910_REV_A_HALL_ASTAR_ROUTE.md

      - name: Clean only DRC-proven residual legacy copper
        run: |
          /usr/bin/python3 ayab-esp32/tools/cleanup_rev_a_hall_v4c.py \
            /tmp/kh910-stage/ayab-esp32.kicad_pcb \
            | tee /tmp/kh910-hall-cleanup.txt

      - name: Validate completed v4c topology
        run: |
          python3 ayab-esp32/tools/migrate_rev_a_hall_pcb_serialized_v4c.py \
            --validate /tmp/kh910-stage/ayab-esp32.kicad_pcb

      - name: Refill staged copper zones with KiCad
        run: |
          /usr/bin/python3 ayab-esp32/tools/refill_rev_a_zones.py \
            /tmp/kh910-stage/ayab-esp32.kicad_pcb
          test -s /tmp/kh910-stage/ayab-esp32.kicad_pcb
          python3 ayab-esp32/tools/migrate_rev_a_hall_pcb_serialized_v4c.py \
            --validate /tmp/kh910-stage/ayab-esp32.kicad_pcb

      - name: Require zero staged project-aware PCB DRC violations
        run: |
          set +e
          kicad-cli pcb drc --exit-code-violations \
            -o /tmp/kh910-staged-drc.rpt \
            /tmp/kh910-stage/ayab-esp32.kicad_pcb
          rc=$?
          set -e
          cat /tmp/kh910-staged-drc.rpt
          exit $rc

      - name: Install validated PCB and recheck in repository project path
        run: |
          cp /tmp/kh910-stage/ayab-esp32.kicad_pcb ayab-esp32/ayab-esp32.kicad_pcb
          python3 ayab-esp32/tools/migrate_rev_a_hall_pcb_serialized_v4c.py \
            --validate ayab-esp32/ayab-esp32.kicad_pcb
          kicad-cli pcb drc --exit-code-violations \
            -o /tmp/kh910-project-drc.rpt \
            ayab-esp32/ayab-esp32.kicad_pcb
          cat /tmp/kh910-project-drc.rpt

      - name: Commit only the validated board and route report
        run: |
          cp /tmp/kh910-stage/KH910_REV_A_HALL_ASTAR_ROUTE.md ayab-esp32/KH910_REV_A_HALL_ASTAR_ROUTE.md
          git config user.name "Newton Sewing Studio AYAB Bot"
          git config user.email "newtonsewingstudio@gmail.com"
          git add ayab-esp32/ayab-esp32.kicad_pcb ayab-esp32/KH910_REV_A_HALL_ASTAR_ROUTE.md
          if git diff --cached --quiet; then
            echo "No PCB changes to commit"
            exit 0
          fi
          git commit -m "Migrate Hall ADC PCB section to Rev A v4c [skip ci]"
          git pull --rebase origin ayab-esp32-kh910-rev-a
          git push origin HEAD:ayab-esp32-kh910-rev-a

      - name: Upload DRC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kh910-hall-pcb-drc-v4c
          path: |
            /tmp/kh910-baseline-drc.rpt
            /tmp/kh910-hall-migration.txt
            /tmp/kh910-hall-cleanup.txt
            /tmp/kh910-staged-drc.rpt
            /tmp/kh910-project-drc.rpt
            /tmp/kh910-stage/KH910_REV_A_HALL_ASTAR_ROUTE.md
          if-no-files-found: ignore
