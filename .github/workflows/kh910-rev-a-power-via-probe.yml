name: KH910 Rev A Power Via Escape Probe

on:
  workflow_dispatch:
  push:
    branches: [ayab-esp32-kh910-rev-a]
    paths:
      - 'ayab-esp32/tools/probe_rev_a_power_via_sites.py'
      - '.github/workflows/kh910-rev-a-power-via-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ayab-esp32-kh910-rev-a
      - name: Install KiCad 9 runtime
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo apt-get install -qy --no-install-recommends kicad
      - name: Find all-layer-clear via escape sites
        run: python3 ayab-esp32/tools/probe_rev_a_power_via_sites.py --output ayab-esp32/KH910_REV_A_POWER_VIA_PROBE.md
      - name: Publish probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ayab-esp32/KH910_REV_A_POWER_VIA_PROBE.md
          if ! git diff --cached --quiet; then
            git commit -m "Record power via escape probe [skip ci]"
            git push origin HEAD:ayab-esp32-kh910-rev-a
          fi
      - name: Archive probe report
        uses: actions/upload-artifact@v4
        with:
          name: kh910-rev-a-power-via-probe
          path: ayab-esp32/KH910_REV_A_POWER_VIA_PROBE.md
