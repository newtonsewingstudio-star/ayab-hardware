name: KH910 Rev A Machine Power Sense

on:
  workflow_dispatch:
  push:
    branches:
      - ayab-esp32-kh910-rev-a
    paths:
      - 'ayab-esp32/tools/patch_rev_a_machine_power_sense.py'
      - 'ayab-esp32/tools/patch_rev_a_machine_power_sense_v2.py'
      - 'ayab-esp32/tools/patch_rev_a_machine_power_sense_v3.py'
      - '.github/workflows/kh910-rev-a-machine-power-sense.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ayab-esp32-kh910-rev-a
          fetch-depth: 0

      - name: Patch machine-power sensing
        run: python3 ayab-esp32/tools/patch_rev_a_machine_power_sense_v3.py

      - name: Inspect generated hierarchy
        run: |
          echo '--- TOP MACHINE_PWR_SENSE ---'
          grep -n -B 5 -A 8 'MACHINE_PWR_SENSE' ayab-esp32/ayab-esp32.kicad_sch || true
          echo '--- TOP 140.97 142.24 ---'
          grep -n -B 3 -A 5 '140.97 142.24' ayab-esp32/ayab-esp32.kicad_sch || true
          echo '--- MCU MACHINE_PWR_SENSE ---'
          grep -n -B 5 -A 8 'MACHINE_PWR_SENSE' ayab-esp32/mcu.kicad_sch || true
          echo '--- MCU GPIO4 COORDINATE ---'
          grep -n -B 4 -A 5 '185.42 82.55' ayab-esp32/mcu.kicad_sch || true

      - name: Generate MCU pin audit
        run: python3 ayab-esp32/tools/audit_esp32_pinmap.py

      - name: Confirm GPIO4 mapping
        run: |
          cat ayab-esp32/KH910_REV_A_CURRENT_PIN_AUDIT.md
          grep -E '\| 4 \|.*MACHINE_PWR_SENSE.*\*\*OK\*\*' ayab-esp32/KH910_REV_A_CURRENT_PIN_AUDIT.md

      - name: Install KiCad
        run: bash ./scripts/dependencies.sh

      - name: Run ERC and DRC before commit
        run: |
          kicad-cli jobset run --file ./ayab-library/ayab-jobset.kicad_jobset --output 546878ce-2bd2-4fb6-b2a1-e67785afa624 ayab-esp32/ayab-esp32.kicad_pro

      - name: Commit validated machine-power sense
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- ayab-esp32/ayab-esp32.kicad_sch ayab-esp32/mcu.kicad_sch ayab-esp32/KH910_REV_A_CURRENT_PIN_AUDIT.md)" ]; then
            echo "Machine-power sensing already in target state"
            exit 0
          fi
          git config user.name "Newton Sewing Studio AYAB Bot"
          git config user.email "newtonsewingstudio@gmail.com"
          git add ayab-esp32/ayab-esp32.kicad_sch \
                  ayab-esp32/mcu.kicad_sch \
                  ayab-esp32/KH910_REV_A_CURRENT_PIN_AUDIT.md
          git commit -m "Add machine power sensing on GPIO4"
          git pull --rebase origin ayab-esp32-kh910-rev-a
          git push

      - name: Archive ERC/DRC artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kh910-rev-a-machine-power-sense-erc-drc
          path: DesignChecks
