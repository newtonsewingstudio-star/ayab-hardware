name: KH910 Rev A Hall Local Copper Audit

on:
  workflow_dispatch:
  push:
    branches:
      - ayab-esp32-kh910-rev-a
    paths:
      - 'ayab-esp32/tools/audit_rev_a_hall_local_copper.py'
      - '.github/workflows/kh910-rev-a-hall-local-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ayab-esp32-kh910-rev-a
          fetch-depth: 0

      - name: Generate Hall local copper audit
        run: |
          python3 ayab-esp32/tools/audit_rev_a_hall_local_copper.py
          test -s ayab-esp32/KH910_REV_A_HALL_LOCAL_COPPER.md
          cat ayab-esp32/KH910_REV_A_HALL_LOCAL_COPPER.md

      - name: Commit audit report
        run: |
          git config user.name "Newton Sewing Studio AYAB Bot"
          git config user.email "newtonsewingstudio@gmail.com"
          git add ayab-esp32/KH910_REV_A_HALL_LOCAL_COPPER.md
          if git diff --cached --quiet; then
            echo "No audit changes to commit"
            exit 0
          fi
          git commit -m "Record Hall local copper audit [skip ci]"
          git pull --rebase origin ayab-esp32-kh910-rev-a
          git push origin HEAD:ayab-esp32-kh910-rev-a
