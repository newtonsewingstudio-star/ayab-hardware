name: KH910 Rev A Hall PCB Parity Audit

on:
  workflow_dispatch:
  push:
    branches:
      - ayab-esp32-kh910-rev-a
    paths:
      - 'ayab-esp32/tools/audit_rev_a_hall_pcb_parity.py'
      - '.github/workflows/kh910-rev-a-hall-pcb-parity.yml'
      - 'ayab-esp32/ayab-esp32.kicad_pcb'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ayab-esp32-kh910-rev-a
          fetch-depth: 0

      - name: Install KiCad
        run: bash ./scripts/dependencies.sh

      - name: Generate native PCB parity audit
        run: |
          python3 ayab-esp32/tools/audit_rev_a_hall_pcb_parity.py
          cat ayab-esp32/KH910_REV_A_HALL_PCB_PARITY.md

      - name: Commit refreshed audit
        run: |
          git config user.name "Newton Sewing Studio AYAB Bot"
          git config user.email "newtonsewingstudio@gmail.com"
          git add ayab-esp32/KH910_REV_A_HALL_PCB_PARITY.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Hall PCB parity audit [skip ci]"
            git pull --rebase origin ayab-esp32-kh910-rev-a
            git push
          fi
